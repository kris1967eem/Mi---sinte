name: Build

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse -Force "build/MiSinte_artefacts/Release/VST3/MiSinte.vst3" "dist/"
          Copy-Item -Force "build/MiSinte_artefacts/Release/Standalone/MiSinte.exe" "dist/"
          

      - uses: actions/upload-artifact@v4
        with:
          name: MiSinte-Windows
          path: dist
      
